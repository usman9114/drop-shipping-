version: 2
models:
  - name: core_fact_offer
    columns:
      - name: pid
        data_tests: [not_null, unique]
      - name: cost
        data_tests: [{in_range: {arguments: {min: 0}}}]
  - name: mart_supply_candidates
    config:
      max_listing_price: "{{ var('max_listing_price') }}"
      max_weight_g: "{{ var('max_weight_g') }}"
      min_us_stock: "{{ var('min_us_stock') }}"
    columns:
      - name: pid
        data_tests: [not_null, unique]
  - name: mart_terapeak_sheet
    columns:
      - name: search_phrase
        data_tests: [not_null, unique]
      - name: priority
        data_tests: [not_null, unique]
  - name: mart_product_velocity
    description: Change over time per product from repeated catalogue pulls.
    columns:
      - name: pid
        data_tests: [not_null, unique]
      - name: stock_drawdown
        data_tests: [not_null, {in_range: {arguments: {min: 0}}}]
  - name: mart_type_evidence
    description: One row per product type; the only table the intelligence layer reads.
    columns:
      - name: product_type
        data_tests: [not_null, unique]
  - name: mart_store_profile
    description: Private. One row per profiled Shopify store with best_score (traffic 45%, rank growth 20%, release rhythm 20%, marketing stack 15%; percentiles among profiled stores) and the business model (brand, reseller, dropship, pod, unclear).
    columns:
      - name: domain
        data_tests: [not_null, unique]
      - name: best_score
        data_tests:
          - in_range:
              arguments: {min: 0, max: 1}
  - name: mart_store_categories
    description: Aggregate per store category (no domains). Committed via scripts/store_export.py.
    columns:
      - name: category
        data_tests: [not_null, unique]
