version: 2
models:
  - name: core_fact_offer
    columns:
      - name: pid
        data_tests: [not_null, unique]
      - name: cost
        data_tests: [{in_range: {arguments: {min: 0}}}]
  - name: mart_supply_candidates
    config:
      max_listing_price: "{{ var('max_listing_price') }}"
      max_weight_g: "{{ var('max_weight_g') }}"
      min_us_stock: "{{ var('min_us_stock') }}"
    columns:
      - name: pid
        data_tests: [not_null, unique]
  - name: mart_terapeak_sheet
    columns:
      - name: search_phrase
        data_tests: [not_null, unique]
      - name: priority
        data_tests: [not_null, unique]
  - name: mart_product_velocity
    description: Change over time per product from repeated catalogue pulls.
    columns:
      - name: pid
        data_tests: [not_null, unique]
      - name: stock_drawdown
        data_tests: [not_null, {in_range: {arguments: {min: 0}}}]
  - name: mart_type_evidence
    description: One row per product type; the only table the intelligence layer reads.
    columns:
      - name: product_type
        data_tests: [not_null, unique]
