version: 2
seeds:
  - name: llm_product_type_cache
    config:
      column_types: {title_sha256: varchar, product_type: varchar, model: varchar, prompt_version: varchar}
  - name: product_type_rules
    config:
      column_types: {priority: integer, pattern: varchar, product_type: varchar}
  - name: rule_category
    config:
      column_types: {rule_id: varchar, level1: varchar, level2: varchar, level3: varchar, action: varchar, reason: varchar}
  - name: rule_title
    config:
      column_types: {rule_id: varchar, pattern: varchar, action: varchar, reason: varchar}
  - name: llm_image_screen_cache
    config:
      column_types: {image_sha256: varchar, clean: boolean, text_overlay: boolean, logo_or_brand: boolean, watermark: boolean, border_or_collage: boolean, person: boolean, child: boolean, model: varchar, prompt_version: varchar}
