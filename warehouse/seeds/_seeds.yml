version: 2
seeds:
  - name: llm_product_type_cache
    config:
      column_types: {title_sha256: varchar, product_type: varchar, model: varchar, prompt_version: varchar}
  - name: product_type_rules
    config:
      column_types: {priority: integer, pattern: varchar, product_type: varchar}
  - name: rule_category
    config:
      column_types: {rule_id: varchar, level1: varchar, level2: varchar, level3: varchar, action: varchar, reason: varchar}
  - name: rule_title
    config:
      column_types: {rule_id: varchar, pattern: varchar, action: varchar, reason: varchar}
  - name: llm_image_screen_cache
    config:
      column_types: {image_sha256: varchar, clean: boolean, text_overlay: boolean, logo_or_brand: boolean, watermark: boolean, border_or_collage: boolean, person: boolean, child: boolean, model: varchar, prompt_version: varchar}
  - name: llm_search_phrase_cache
    config:
      column_types: {title_sha256: varchar, search_phrase: varchar, model: varchar, prompt_version: varchar}
  - name: rule_why
    description: Why a product type sells (rule-based judgment, reviewable). Tags are pipe-separated.
    config:
      column_types: {product_type: varchar, why_tags: varchar, reason: varchar}
  - name: store_category_rules
    description: Keyword rules mapping a store product (type, title, tags) to a category. Lowest priority number wins. Used by scout.stores and the store marts.
    config:
      column_types: {priority: integer, category: varchar, pattern: varchar}
