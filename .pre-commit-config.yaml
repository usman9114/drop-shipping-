# Install once per clone:  make setup   (or: pre-commit install --install-hooks)
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
exclude: ^(graphify-out/|\.claude/skills/graphify/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # Secret scanning: eBay / supplier / LLM API keys must never be committed.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # content-hash cache keys (sha256) look like secrets but are not
        exclude: ^docs/reviews/panel/cache\.jsonl$

  # Python lint + format (for the PoC code that comes next).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^data/  # one-off evidence reproduction scripts
      - id: ruff-format
        exclude: ^data/

  - repo: local
    hooks:
      - id: no-ai-attribution
        name: reject AI attribution in commit message / author
        entry: python3 scripts/hooks/check_no_ai_attribution.py
        language: system
        stages: [commit-msg]
        always_run: true
