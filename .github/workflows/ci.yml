name: ci

# Lean on purpose: tests and lint only. No secrets, no data pulls.
# Scheduled ingestion is deferred (see docs/decisions/0004).

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Lint, hygiene and secret scan
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure
