name: ci

# Lean on purpose: tests, lint and the README guard. No secrets, no data pulls.
# Scheduled ingestion lives in autopilot.yml (decision 0016).

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Smoke
        run: |
          pip install -q -r requirements.txt
          python -m scout.market_rank --help > /dev/null
          python -m scout.autopilot daily --dry-run > /dev/null

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint, hygiene and secret scan
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure

  readme-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: README matches its committed stats
        run: |
          test -f scripts/readme_build.py || { echo "scripts/readme_build.py missing"; exit 1; }
          pip install -q -r requirements.txt
          python scripts/readme_build.py --from-stats docs/readme/stats.json
          if [ -n "$(git status --porcelain -- README.md docs/readme/)" ]; then
            git status --porcelain -- README.md docs/readme/
            echo "README is out of date with docs/readme/stats.json"
            exit 1
          fi
